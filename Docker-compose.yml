
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: social-dashboard-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: social_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - social-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: social-dashboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - social-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  # Background Worker
  worker:
    build: ./backend
    container_name: social-dashboard-worker
    command: node worker.js
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/social_dashboard
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_change_in_production}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - social-network
    healthcheck:
      disable: true
    restart: unless-stopped
  
  # Backend API
  backend:
    build: ./backend
    container_name: social-dashboard-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/social_dashboard
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_change_in_production}
      PORT: 3070
      NODE_ENV: production
    ports:
      - "3070:3070"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - social-network
    restart: unless-stopped
  # Frontend
  frontend:
    build: ./frontend
    container_name: social-dashboard-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - social-network
    restart: unless-stopped

# Volumes for persistent data
volumes:
  postgres_data:
  redis_data:

# Network for communication
networks:
  social-network:
    driver: bridge