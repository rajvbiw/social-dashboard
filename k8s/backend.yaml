apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: social-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
            - secretRef:
                name: social-dashboard-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          imagePullPolicy: IfNotPresent
          readinessProbe:
            httpGet:
              path: /health
              port: 3070
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3070
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: social-dashboard
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3070
      targetPort: 3070
      nodePort: 30070
