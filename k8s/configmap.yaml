apiVersion: v1
kind: ConfigMap
metadata:
  name: social-dashboard-config
  namespace: social-dashboard
data:
  POSTGRES_USER: postgres
  POSTGRES_DB: social_dashboard
  DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/social_dashboard
  REDIS_URL: redis://redis:6379
  PORT: "3070"
  NODE_ENV: production
  INIT_DB_SQL: |
    -- Create tables
    CREATE TABLE IF NOT EXISTS users (
      id SERIAL PRIMARY KEY,
      email VARCHAR(255) UNIQUE NOT NULL,
      password_hash VARCHAR(255) NOT NULL,
      created_at TIMESTAMP DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS posts (
      id SERIAL PRIMARY KEY,
      user_id INTEGER REFERENCES users(id) ON DELETE CASCADE,
      content TEXT NOT NULL,
      scheduled_for TIMESTAMP NOT NULL,
      status VARCHAR(50) DEFAULT 'pending',
      created_at TIMESTAMP DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS metrics (
      id SERIAL PRIMARY KEY,
      user_id INTEGER REFERENCES users(id) ON DELETE CASCADE,
      platform VARCHAR(50),
      metric_name VARCHAR(50),
      value INTEGER,
      recorded_at TIMESTAMP DEFAULT NOW()
    );

    -- Insert test user (password: test123)
    INSERT INTO users (email, password_hash) 
    VALUES ('test@example.com', '$2a$10$rQKjT7XJ7XJ7XJ7XJ7XJ7u') 
